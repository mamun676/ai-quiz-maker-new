<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZ//AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-container">
        
        <!-- SETUP SCREEN -->
        <section id="setup-screen" class="screen active">
            <header class="hero-header">
                <h1 class="brand-title">QUIZ//AI</h1>
                <p class="brand-subtitle">GENERATE. ATTEMPT. LEARN.</p>
            </header>

            <div class="brutal-card">
                <div class="input-group">
                    <label for="topic">TOPIC</label>
                    <input type="text" id="topic" placeholder="e.g. JavaScript, Physics, World History...">
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="difficulty">DIFFICULTY</label>
                        <select id="difficulty">
                            <option value="Easy">EASY</option>
                            <option value="Medium" selected>MEDIUM</option>
                            <option value="Hard">HARD</option>
                            <option value="Expert">EXPERT</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="questionCount">QUESTIONS</label>
                        <select id="questionCount">
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="15">15</option>
                            <option value="20">20</option>
                        </select>
                    </div>
                </div>

                <button id="btn-generate" class="primary-btn brutal-btn">GENERATE QUIZ &rarr;</button>
                <p class="api-note">Powered by Groq &bull; GPT-OSS-120B</p>
            </div>
        </section>

        <!-- LOADING SCREEN -->
        <section id="loading-screen" class="screen">
            <div class="brutal-card text-center loading-box">
                <h2>GENERATING QUIZ...</h2>
                <p class="blink">AI IS THINKING.</p>
                <div class="fake-progress">
                    <div class="fake-bar"></div>
                </div>
            </div>
        </section>

        <!-- ERROR SCREEN -->
        <section id="error-screen" class="screen">
            <div class="brutal-card error-card">
                <h2>ERROR!</h2>
                <p id="error-message">Unable to generate the quiz.</p>
                <button id="btn-error-back" class="brutal-btn">&larr; BACK TO SETUP</button>
            </div>
        </section>

        <!-- QUIZ SCREEN -->
        <section id="quiz-screen" class="screen">
            <header class="quiz-header">
                <h2>AI QUIZ</h2>
                <div class="progress-container">
                    <span id="progress-text">QUESTION 1 / 10</span>
                    <div class="progress-track">
                        <div id="progress-bar" class="progress-fill"></div>
                    </div>
                </div>
            </header>

            <div class="brutal-card question-card">
                <h3 id="question-text" class="question-title">Question goes here?</h3>
                <div id="options-container" class="options-grid">
                    <!-- Options injected via JS -->
                </div>
            </div>

            <nav class="quiz-nav">
                <button id="btn-prev" class="brutal-btn">&larr; PREVIOUS</button>
                <button id="btn-next" class="brutal-btn">NEXT &rarr;</button>
                <button id="btn-submit" class="brutal-btn primary-btn hidden">SUBMIT QUIZ &rarr;</button>
            </nav>
        </section>

        <!-- RESULT SCREEN -->
        <section id="results-screen" class="screen">
            <div class="brutal-card result-summary text-center">
                <h2 class="result-title">QUIZ COMPLETE!</h2>
                <h1 id="score-percentage" class="score-huge">0%</h1>
                <h3 id="score-fraction" class="score-fraction">0 / 0</h3>
                <h4 id="score-message" class="score-message">MESSAGE</h4>
                
                <div class="score-stats">
                    <div class="stat correct-stat">&check; CORRECT <span id="stat-correct">0</span></div>
                    <div class="stat wrong-stat">&cross; WRONG <span id="stat-wrong">0</span></div>
                </div>

                <div class="result-actions">
                    <button id="btn-retake" class="brutal-btn">RETAKE QUIZ</button>
                    <button id="btn-new" class="brutal-btn primary-btn">NEW QUIZ</button>
                </div>
            </div>

            <div class="review-section">
                <h3>ANSWER REVIEW</h3>
                <div id="review-container">
                    <!-- Review cards injected via JS -->
                </div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
