<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quiz Maker</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Ambient Background Elements -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <main class="container">
        <!-- Error Toast Notification -->
        <div id="error-toast" class="glass hidden">
            <span class="icon">⚠️</span>
            <p id="error-message">Something went wrong.</p>
            <button id="close-error">&times;</button>
        </div>

        <!-- 1. Setup Screen -->
        <section id="setup-screen" class="glass panel active">
            <header>
                <h1>AI Quiz Maker</h1>
                <p class="subtitle">Create personalized quizzes powered by AI</p>
                <div class="badge">✨ Powered by Groq AI</div>
            </header>
            
            <form id="setup-form">
                <div class="form-group">
                    <label for="topic">Topic</label>
                    <input type="text" id="topic" placeholder="Enter quiz topic... (e.g., JavaScript, World History)" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="num-questions">Number of Questions</label>
                        <select id="num-questions">
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="15">15</option>
                            <option value="20">20</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="difficulty">Difficulty</label>
                        <select id="difficulty">
                            <option value="Easy">Easy</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="Hard">Hard</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" id="generate-btn" class="btn-primary">Generate Quiz</button>
            </form>
        </section>

        <!-- 2. Loading Screen -->
        <section id="loading-screen" class="glass panel hidden text-center">
            <div class="loader-container">
                <div class="spinner"></div>
            </div>
            <h2>✨ Creating your quiz...</h2>
            <p class="subtitle">AI is preparing challenging questions for you.</p>
        </section>

        <!-- 3. Quiz Screen -->
        <section id="quiz-screen" class="glass panel hidden">
            <header class="quiz-header">
                <h3 id="quiz-title">Quiz Title</h3>
                <span id="question-tracker" class="badge">Question 1 of 10</span>
            </header>
            
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            
            <div class="question-container">
                <h2 id="question-text">Question text goes here?</h2>
                <div id="options-container" class="options-grid">
                    <!-- Options injected via JS -->
                </div>
            </div>
            
            <div class="action-footer">
                <p id="explanation-text" class="explanation hidden"></p>
                <button id="next-btn" class="btn-primary hidden">Next Question &rarr;</button>
            </div>
        </section>

        <!-- 4. Result Screen -->
        <section id="result-screen" class="glass panel hidden">
            <header class="result-header text-center">
                <h2>Quiz Completed!</h2>
                <div class="score-circle">
                    <span id="score-percentage">0%</span>
                </div>
                <h3 id="score-text">0 / 10</h3>
                <p id="performance-msg" class="subtitle">Great job!</p>
            </header>
            
            <div class="review-section">
                <h3>Question Review</h3>
                <div id="review-container">
                    <!-- Reviews injected via JS -->
                </div>
            </div>
            
            <button id="restart-btn" class="btn-primary full-width mt-2">Create Another Quiz</button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
